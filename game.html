<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Dodger — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #07070f; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: "DejaVu Sans Mono", monospace; color: #e8e8f2; }
  h1 { font-size: 20px; letter-spacing: 6px; color: #22d3ee; margin: 0 0 8px; text-shadow: 0 0 18px #22d3ee; }
  #hint { font-size: 12px; letter-spacing: 2px; color: #8b8ba3; margin-top: 10px; }
  canvas { display: block; background: #0a0a18; border: 1px solid #262640; border-radius: 10px;
           box-shadow: 0 0 40px rgba(34, 211, 238, 0.25); }
</style>
</head>
<body>
<h1>NEON DODGER</h1>
<canvas id="game" width="480" height="800"></canvas>
<div id="hint">ARROW KEYS OR A / D TO STEER &nbsp;•&nbsp; R TO RESTART</div>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  // --- state ---
  var ship = { x: W / 2, y: H * 0.88, w: 34, speed: 250 };
  var meteors = [];
  var stars = [];
  var keys = {};
  var score = 0, dodged = 0, elapsed = 0, over = false, started = false;
  var spawnTimer = 0, last = 0;

  for (var i = 0; i < 80; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4, tw: Math.random() * Math.PI * 2 });
  }

  function spawnMeteor() {
    var r = 8 + Math.random() * 7; // radius 8..15 px on the 480-wide canvas
    meteors.push({
      x: 20 + Math.random() * (W - 40),
      y: -30,
      r: r,
      speed: 125 + elapsed * 9 + Math.random() * 20,
      drift: (Math.random() - 0.5) * 30,
      hue: Math.random() < 0.5 ? '#fb7185' : '#f97316'
    });
  }

  function reset() {
    meteors = [];
    score = 0; dodged = 0; elapsed = 0; over = false; started = true;
    ship.x = W / 2; spawnTimer = 0; last = performance.now();
  }

  function update(dt) {
    if (over) return;
    elapsed += dt;
    score = Math.floor(elapsed * 10) + dodged * 5;

    if (keys.ArrowLeft || keys.KeyA) ship.x -= ship.speed * dt;
    if (keys.ArrowRight || keys.KeyD) ship.x += ship.speed * dt;
    ship.x = Math.max(24, Math.min(W - 24, ship.x));

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnMeteor();
      if (elapsed > 8) spawnMeteor();
      spawnTimer = 0.55;
    }

    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.y += m.speed * dt;
      m.x += m.drift * dt;
      if (m.y - m.r > H) { meteors.splice(i, 1); dodged++; continue; }
      var dx = m.x - ship.x, dy = m.y - ship.y;
      if (dx * dx + dy * dy < (m.r + 13) * (m.r + 13)) { over = true; }
    }
  }

  function drawShip() {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#22d3ee';
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(16, 14); ctx.lineTo(0, 6); ctx.lineTo(-16, 14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0a18'; ctx.fillRect(0, 0, W, H);
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.35 + 0.3 * Math.sin(performance.now() / 500 + st.tw);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px "DejaVu Sans Mono", monospace';
    ctx.fillStyle = '#8b8ba3';
    ctx.fillText('SCORE', W / 2, 34);
    ctx.font = 'bold 34px "DejaVu Sans Mono", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(score).padStart(4, '0'), W / 2, 72);

    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i];
      ctx.save();
      ctx.shadowColor = m.hue; ctx.shadowBlur = 18;
      ctx.fillStyle = m.hue;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(m.x - m.r * 0.3, m.y - m.r * 0.3, m.r * 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    if (!started) {
      ctx.fillStyle = 'rgba(7,7,15,0.72)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#22d3ee'; ctx.font = 'bold 30px "DejaVu Sans Mono", monospace';
      ctx.fillText('NEON DODGER', W / 2, H / 2 - 30);
      ctx.fillStyle = '#e8e8f2'; ctx.font = '16px "DejaVu Sans Mono", monospace';
      ctx.fillText('Dodge the meteors.', W / 2, H / 2 + 8);
      ctx.fillText('Chase the score.', W / 2, H / 2 + 34);
      ctx.fillStyle = '#8b8ba3'; ctx.font = 'bold 15px "DejaVu Sans Mono", monospace';
      ctx.fillText('PRESS ANY ARROW KEY TO START', W / 2, H / 2 + 80);
    } else if (over) {
      ctx.fillStyle = 'rgba(7,7,15,0.72)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fb7185'; ctx.font = 'bold 38px "DejaVu Sans Mono", monospace';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px "DejaVu Sans Mono", monospace';
      ctx.fillText('SCORE ' + score, W / 2, H / 2 + 24);
      ctx.fillStyle = '#8b8ba3'; ctx.font = 'bold 15px "DejaVu Sans Mono", monospace';
      ctx.fillText('PRESS R TO RESTART', W / 2, H / 2 + 66);
    } else {
      drawShip();
    }
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (started) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (!started && (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD')) reset();
    if (over && e.code === 'KeyR') reset();
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });

  canvas.addEventListener('pointerdown', function (e) {
    if (!started || over) { reset(); return; }
    var rect = canvas.getBoundingClientRect();
    ship.x = (e.clientX - rect.left) * (W / rect.width);
  });

  last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
